plugins {
    id 'java-library'
    id 'java-gradle-plugin'
    id 'maven-publish'
    id 'com.gradleup.shadow' version '8.3.10'
}

group = 'com.kyroxova'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
    withSourcesJar()
}

repositories {
    mavenCentral()
}

configurations {
    pinnedJavaParser
    shadowJavaParser
}

dependencies {
    implementation 'org.ow2.asm:asm:9.10.1'
    implementation 'org.ow2.asm:asm-commons:9.10.1'
    implementation 'org.ow2.asm:asm-tree:9.10.1'
    implementation 'org.ow2.asm:asm-analysis:9.10.1'
    implementation 'net.fabricmc:mapping-io:0.9.1'
    pinnedJavaParser 'com.github.javaparser:javaparser-core:3.28.2'
    shadowJavaParser 'com.github.javaparser:javaparser-symbol-solver-core:3.28.2'
    implementation 'com.github.javaparser:javaparser-core:3.28.2'
    implementation 'com.github.javaparser:javaparser-symbol-solver-core:3.28.2'
    implementation 'com.google.code.gson:gson:2.11.0'
    testImplementation gradleTestKit()
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

def withoutBundledJavaParser = { files ->
    files.filter { !it.name.startsWith('javaparser-core-') }
}

sourceSets.main.compileClasspath = files(
        configurations.pinnedJavaParser,
        withoutBundledJavaParser(sourceSets.main.compileClasspath)
)
sourceSets.test.compileClasspath = files(
        configurations.pinnedJavaParser,
        withoutBundledJavaParser(sourceSets.test.compileClasspath)
)
sourceSets.test.runtimeClasspath = files(
        sourceSets.test.output,
        configurations.pinnedJavaParser,
        withoutBundledJavaParser(sourceSets.test.runtimeClasspath)
)

tasks.named('jar') {
    archiveClassifier = 'plain'
}

tasks.named('shadowJar') {
    archiveClassifier = ''
    configurations = [project.configurations.shadowJavaParser]
    relocate 'com.github.javaparser', 'com.kyroxova.continuumlib.internal.javaparser'
    relocate 'com.google.common', 'com.kyroxova.continuumlib.internal.guava'
    relocate 'javassist', 'com.kyroxova.continuumlib.internal.javassist'
    relocate 'org.checkerframework', 'com.kyroxova.continuumlib.internal.checkerframework'
}

gradlePlugin {
    plugins {
        continuumLib {
            id = 'com.kyroxova.continuumlib'
            implementationClass = 'com.kyroxova.continuumlib.gradle.ContinuumLibPlugin'
            displayName = 'ContinuumLib'
            description = 'Inspects compiled mod APIs for ContinuumLib adaptation'
        }
    }
}

// A portable Maven repository, including the Gradle plugin marker and dependency metadata.
// No remote upload or modification of the developer's Maven cache is performed.
publishing {
    publications.withType(MavenPublication).configureEach {
        pom.withXml {
            asNode().dependencies?.dependency?.findAll {
                it.groupId?.text() == 'com.github.javaparser'
            }?.each { it.parent().remove(it) }
        }
    }

    repositories {
        maven {
            name = 'distribution'
            url = layout.buildDirectory.dir('repository')
        }
    }
}

tasks.named('test') {
    useJUnitPlatform()
    dependsOn 'publishAllPublicationsToDistributionRepository'
    dependsOn 'shadowJar'
    systemProperty 'continuumlib.shadowJar',
            tasks.named('shadowJar').flatMap { it.archiveFile }.get().asFile.absolutePath
    inputs.dir(layout.buildDirectory.dir('repository'))
    systemProperty 'continuumlib.testRepository', layout.buildDirectory.dir('repository').get().asFile.absolutePath
    systemProperty 'continuumlib.testVersion', project.version.toString()
    if (project.hasProperty('inspectionArtifact')) {
        systemProperty 'continuumlib.testArtifact', project.property('inspectionArtifact')
    }
    if (project.hasProperty('forgeArtifacts')) {
        systemProperty 'continuumlib.forgeArtifacts', project.property('forgeArtifacts')
    }
    if (project.hasProperty('referenceClasses')) {
        systemProperty 'continuumlib.referenceClasses', project.property('referenceClasses')
    }
    if (project.hasProperty('officialMappings')) {
        systemProperty 'continuumlib.officialMappings', project.property('officialMappings')
    }
    if (project.hasProperty('minecraftArtifacts')) {
        systemProperty 'continuumlib.minecraftArtifacts', project.property('minecraftArtifacts')
    }
    if (project.hasProperty('minecraftJava21')) {
        systemProperty 'continuumlib.minecraftJava21', project.property('minecraftJava21')
    }
    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat "full"
    }
}

tasks.withType(JavaCompile).configureEach { task ->
    options.encoding = 'UTF-8'
}


afterEvaluate {
    publishing.publications.named('pluginMaven') {
        artifact(tasks.named('shadowJar')) {
            classifier = null
        }
    }
}
